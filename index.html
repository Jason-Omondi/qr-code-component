<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Component</title>

  <!-- Google Font: Outfit -->
  <link href="https://fonts.googleapis.com/css?family=Roboto&amp;display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page">
    <article class="card">

      <div id="qr-container" class="qr-box"></div>

      <h1 class="title">Improve your front-end skills by building projects</h1>

      <p class="subtitle">
        Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
      </p>

      <!-- Move tools INSIDE card -->
      <div class="qr-tools">
        <label for="qr-input" class="qr-label">Enter URL to generate:</label>
        <input 
          id="qr-input" 
          class="qr-input" 
          type="text" 
          placeholder="https://example.com" 
        />
        <button id="qr-btn" class="qr-btn">Generate QR</button>
      </div>

      <!-- History section -->
      <div id="qr-history" class="qr-history"></div>
    </article>
  </main>

  <!-- QR generator library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
