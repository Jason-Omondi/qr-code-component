name: Frontend CI + Deploy

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      # STEP 1 — Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP 2 — Setup Node (for future tooling)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # STEP 3 — Install deps (if exists)
      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm install

      # STEP 4 — Validate HTML
      - name: Validate HTML
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy
          find . -name "*.html" -print0 | xargs -0 -I{} tidy -qe {}

      # STEP 5 — Optional CSS lint
      - name: Validate CSS
        if: hashFiles('.stylelintrc*') != ''
        run: npx stylelint "**/*.css"

      # STEP 6 — Optional JS lint
      - name: Lint JavaScript
        if: hashFiles('.eslintrc*') != ''
        run: npx eslint "**/*.js"

      # STEP 7 — Build (if needed later for React/Next)
      - name: Build project (optional)
        if: hashFiles('package.json') != ''
        run: npm run build --if-present

  # Deploy ONLY when code is pushed directly to main
  # (This happens after a PR from develop is merged)
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploying to GitHub Pages
        run: echo "Deploying from main branch..."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

      - name: ✅ Deployment Complete
        run: echo "Live at ${{ steps.deployment.outputs.page_url }}"
